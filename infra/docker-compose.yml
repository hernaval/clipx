version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clipx
      POSTGRES_USER: clipx
      POSTGRES_PASSWORD: clipx-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipx"]
      interval: 10s
      timeout: 3s
      retries: 3

  clipx-server:
    build:
      context: ../
      dockerfile: infra/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "sqlite:clipx-server.db?mode=rwc"
      JWT_SECRET: "clipx-dev-secret-change-in-production!"
      REDIS_URL: "redis://redis:6379"
      BIND_ADDR: "0.0.0.0:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
