openapi: 3.1.0
info:
  title: ClipX Sync Server API
  version: 1.0.0
  description: Central sync broker for ClipX clipboard synchronization

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/clips:
    post:
      summary: Upload a clipboard clip
      operationId: uploadClip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipUpload'
      responses:
        '201':
          description: Clip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipResponse'
        '409':
          description: Duplicate clip_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get recent clips
      operationId: getClips
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: List of clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clip'

  /api/v1/pair/request:
    post:
      summary: Request a pairing token
      operationId: pairRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pairing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairTokenResponse'

  /api/v1/pair/confirm:
    post:
      summary: Confirm pairing with token
      operationId: pairConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairConfirm'
      responses:
        '200':
          description: Pairing confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairResponse'
        '401':
          description: Invalid or expired token

  /api/v1/devices:
    get:
      summary: List paired devices
      operationId: getDevices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

  /api/v1/devices/{id}:
    delete:
      summary: Revoke a device
      operationId: revokeDevice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked
        '404':
          description: Device not found

  /api/v1/audit-logs:
    get:
      summary: Get audit logs
      operationId: getAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'

  /api/v1/ws:
    get:
      summary: WebSocket connection for real-time clips
      operationId: wsConnect
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '101':
          description: WebSocket upgrade

  /api/v1/sse:
    get:
      summary: SSE stream for real-time clips
      operationId: sseConnect
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream: {}

  /api/v1/bootstrap:
    post:
      summary: Bootstrap a new user and device (dev only)
      operationId: bootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, device_name]
              properties:
                email:
                  type: string
                device_name:
                  type: string
                public_key:
                  type: string
      responses:
        '200':
          description: Bootstrap response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  device_id:
                    type: string
                    format: uuid
                  jwt:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClipUpload:
      type: object
      required: [device_id, clip_id, timestamp, format, content, e2e]
      properties:
        device_id:
          type: string
          format: uuid
        clip_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        format:
          type: string
          enum: [text]
        content:
          type: string
        e2e:
          type: boolean

    Clip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        content:
          type: string
        format:
          type: string
        e2e:
          type: boolean
        created_at:
          type: string
          format: date-time

    ClipResponse:
      type: object
      properties:
        status:
          type: string
        clip_id:
          type: string
          format: uuid

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        public_key:
          type: string
        paired_at:
          type: string
          format: date-time
        revoked:
          type: boolean

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        action:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    PairTokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    PairConfirm:
      type: object
      required: [token, device_name]
      properties:
        token:
          type: string
        device_name:
          type: string
        public_key:
          type: string

    PairResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_token:
          type: string
        jwt:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
