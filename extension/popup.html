<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
      white-space: nowrap;
    }
    .status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #0f3460;
      white-space: nowrap;
    }
    .status.connected { color: #4ade80; }
    .status.disconnected { color: #f87171; }
    .icon-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, opacity 0.2s;
    }
    .icon-btn:hover { opacity: 0.85; }
    .icon-btn.active {
      background: #e94560;
      color: white;
    }
    .actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #0f3460;
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #e94560;
      color: white;
    }
    .btn-secondary {
      background: #0f3460;
      color: #e0e0e0;
    }
    .pair-hint {
      display: none;
      padding: 8px 16px;
      font-size: 11px;
      color: #f0c987;
      background: #2a2440;
      border-bottom: 1px solid #0f3460;
    }
    .pair-hint.show { display: block; }
    .pair-hint button {
      background: none;
      border: none;
      color: #e94560;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .clip-list {
      max-height: 320px;
      overflow-y: auto;
    }
    .clip-item {
      padding: 10px 16px;
      border-bottom: 1px solid #0f3460;
      cursor: pointer;
      transition: background 0.15s;
    }
    .clip-item:hover { background: #16213e; }
    .clip-content {
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 330px;
    }
    .clip-meta {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: #666;
      font-size: 13px;
    }
    .settings-section {
      padding: 12px 16px;
      border-top: 1px solid #0f3460;
    }
    .settings-section label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #888;
    }
    .settings-section input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 12px;
    }
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #4ade80;
      color: #000;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .toast.show { display: block; }
    .main-view.hidden { display: none; }
    #pairing-section { display: none; }
    #pairing-section.active { display: block; }
    .subview-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #0f3460;
    }
    .subview-header h2 {
      font-size: 14px;
      font-weight: 600;
    }
    .back-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>ClipX</h1>
      <span id="status" class="status disconnected">Disconnected</span>
    </div>
    <button id="pair-btn" class="icon-btn" title="Pairing settings" aria-label="Pairing settings">⚙</button>
  </div>

  <div id="main-view" class="main-view">
    <div id="pair-hint" class="pair-hint">
      Not paired with a server. Open <button id="pair-hint-btn">pairing settings</button> to connect.
    </div>

    <div class="actions">
      <button id="push-btn" class="btn btn-primary">Push Clipboard</button>
    </div>

    <div id="clip-list" class="clip-list">
      <div class="empty">No clips yet. Push your clipboard or wait for synced clips.</div>
    </div>
  </div>

  <div id="pairing-section">
    <div class="subview-header">
      <button id="back-btn" class="back-btn" title="Back" aria-label="Back">←</button>
      <h2>Pairing Settings</h2>
    </div>
    <div class="settings-section">
      <label>Quick pair (paste <code>clipx://pair?…</code> URI)</label>
      <input id="pair-uri" type="text" placeholder="clipx://pair?server=…&amp;token=…">
      <button id="apply-uri" class="btn btn-secondary" style="margin-top: 6px; width: 100%;">Use Pair URI</button>
      <div style="text-align:center; color:#666; font-size:11px; margin: 10px 0;">— or enter manually —</div>
      <label>Server URL</label>
      <input id="server-url" type="text" placeholder="https://sync.example.com">
      <label style="margin-top: 8px;">Pairing Token</label>
      <input id="pair-token" type="text" placeholder="Enter pairing token">
      <button id="confirm-pair" class="btn btn-primary" style="margin-top: 8px; width: 100%;">Confirm Pairing</button>
    </div>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script type="module" src="src/popup.js"></script>
</body>
</html>
